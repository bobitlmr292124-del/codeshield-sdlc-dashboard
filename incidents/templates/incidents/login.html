
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeShield</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b1120;
            color: #edf3fc;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #151f32;
            padding: 35px;
            border: 1px solid #2b3b55;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9aabc3;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2b3b55;
            background: #0b1120;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #38bdf8;
            color: #0b1120;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        .errors {
            color: #fb7185;
            margin-top: 12px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #9aabc3;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CodeShield</h1>
        <p class="subtitle">Sign in to your security dashboard</p>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <div class="errors">{{ error }}</div>
                {% endfor %}
            {% endfor %}

            {% for error in form.non_field_errors %}
                <div class="errors">{{ error }}</div>
            {% endfor %}

            <button type="submit">Log In</button>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="{% url 'register' %}">Create one</a>
        </div>
    </div>
</body>
</html>
